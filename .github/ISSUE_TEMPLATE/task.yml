name: Task
description: A unit of work for Lab01
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [crypto, network, consensus, execution, tests, docs, ci]
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
